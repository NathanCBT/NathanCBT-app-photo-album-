<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../../assets/icons/faviconMemora.svg"
    />
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../css/profile.css" />
  </head>
  <body>
    <div class="profile-container">
      <div
        class="profile-banner"
        style="background-image: url(&quot;../../../assets/IMG/&quot;)"
      >
        <a
          href="#"
          class="back-arrow-btn"
          onclick="event.preventDefault()"
          title="Retour"
        >
          <span class="arrow-left-icon"></span>
        </a>
      </div>

      <div class="profile-content-wrapper">
        <div class="profile-header-main">
          <div class="profile-avatar-large"></div>

          <div class="profile-identity-box">
            <div class="profile-name-row">
              <h1>Lucas Martin</h1>
              <div class="profile-actions-group">
                <button type="button" class="btn-follow" id="follow-toggle-btn">
                  Suivre
                </button>
                <button type="button" class="btn-more-options">•••</button>
              </div>
            </div>
            <p class="profile-handle">@lucas.martin</p>
            <p class="profile-bio">
              Lorem ipsum dolor sit amet adipiscing id aliqua non sit minim sunt
              cupidatat.
            </p>
          </div>
        </div>

        <div class="profile-stats-row">
          <div class="stat-item"><strong>12</strong><span>Albums</span></div>
          <div class="stat-item"><strong>216</strong><span>Photos</span></div>
          <div class="stat-item">
            <strong id="followers-count">72</strong><span>Abonnés</span>
          </div>
          <div class="stat-item">
            <strong>89</strong><span>Abonnements</span>
          </div>
        </div>

        <hr class="profile-divider" />

        <div class="albums-grid" id="public-albums-grid"></div>
      </div>
    </div>

    <script src="../js/profile.js"></script>
  </body>
</html>
