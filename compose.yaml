services:
  # serveur Web + PHP
  app:
    build: .
    container_name: memora_web_app
    restart: always
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: memora_mysql_db
    restart: always
    ports:
      - "0.0.0.0:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql

  gui:
    image: phpmyadmin:latest
    container_name: memora_phpmyadmin
    restart: always
    ports:
      - "0.0.0.0:8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
